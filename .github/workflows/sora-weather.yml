name: Sora Weather iOS
on:
  push:
    branches: [sora-weather-ios26]
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed IPA (requires Apple signing secrets)
        type: boolean
        default: false
      method:
        description: Signing/export method
        type: choice
        options: [release-testing, debugging, app-store-connect]
        default: release-testing
permissions:
  contents: read
defaults:
  run:
    working-directory: SoraWeather
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-unsigned:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26
        run: bash scripts/select_xcode.sh
      - name: Validate project structure
        run: python3 scripts/validate_project.py
      - name: Execute parser and rain policy tests
        run: |
          set -euo pipefail
          mkdir -p build
          swift test --enable-code-coverage 2>&1 | tee build/swift-tests.log
      - name: Archive unsigned device app and package IPA
        run: |
          set -euo pipefail
          xcodebuild -project SoraWeather.xcodeproj -scheme SoraWeather -configuration Release -destination 'generic/platform=iOS' -archivePath build/SoraWeather-unsigned.xcarchive archive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          python3 scripts/package_unsigned.py
      - uses: actions/upload-artifact@v4
        with:
          name: SoraWeather-unsigned-IPA
          path: SoraWeather/build/SoraWeather-unsigned.ipa
      - name: Build and launch on iOS 26 simulator
        timeout-minutes: 8
        continue-on-error: true
        run: bash scripts/simulator_smoke.sh
      - name: SwiftUI Instruments and UI regression
        timeout-minutes: 12
        run: python3 scripts/profile_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            SoraWeather/build/performance-summary.txt
            SoraWeather/build/SwiftUI-toc.xml
            SoraWeather/build/trace-*.xml
            SoraWeather/build/ui-*.log
            SoraWeather/build/instruments*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Instruments-SwiftUI-trace
          path: SoraWeather/build/SwiftUI.trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: SoraWeather/build/ui-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: |
            SoraWeather/build/*.log
            SoraWeather/build/simulator.png
