name: Validate Sakura Card Core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validation/**'
      - '.github/workflows/core-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run native Swift regression checks without simulator
        run: |
          mkdir -p build/core
          swiftc -swift-version 5 -parse-as-library -target arm64-apple-macos26.0 PayCompass/Models.swift PayCompass/Catalog.swift PayCompass/Appearance.swift PayCompass/Store.swift validation/main.swift -o build/core/validate
          build/core/validate | tee build/core/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SakuraCard-core-validation
          path: build/core/results.txt
          retention-days: 7
